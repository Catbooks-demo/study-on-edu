name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # 브랜치 보호의 필수 체크 이름. 바꾸지 않는다.
    name: web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studyon
          POSTGRES_PASSWORD: studyon
          POSTGRES_DB: studyon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://studyon:studyon@localhost:5432/studyon_test
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      APP_BASE_URL: http://localhost:3000
      JOBS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: DB 마이그레이션
        run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # 수강생 흐름을 실제 브라우저로: 빌드 → next start → Playwright (모의 결제)
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studyon
          POSTGRES_PASSWORD: studyon
          POSTGRES_DB: studyon_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://studyon:studyon@localhost:5432/studyon_e2e
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      APP_BASE_URL: http://localhost:3000
      JOBS_ENABLED: "false"
      SEED_STAFF_EMAIL: admin@studyon.test
      SEED_STAFF_PASSWORD: e2e-admin-pass
      SEED_INSTRUCTOR_PASSWORD: e2e-instructor-pass
      NEXT_PUBLIC_HEARTBEAT_SEC: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: 시드
        run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens
          retention-days: 7
          if-no-files-found: ignore

  docker:
    # 온프레미스 배포 연습: docs/deploy.md 순서대로 compose로 띄우고 시드·상태 확인·재시작까지
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env 만들기 (CI 전용 값)
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-db-pass/' .env
          sed -i 's/^SESSION_SECRET=.*/SESSION_SECRET=ci-only-session-secret-0123456789abcdef/' .env
          sed -i 's/^SEED_STAFF_EMAIL=.*/SEED_STAFF_EMAIL=admin@studyon.test/' .env
          sed -i 's/^SEED_STAFF_PASSWORD=.*/SEED_STAFF_PASSWORD=ci-only-admin-pass/' .env
          sed -i 's/^SEED_INSTRUCTOR_PASSWORD=.*/SEED_INSTRUCTOR_PASSWORD=ci-only-instructor-pass/' .env
      - run: docker compose config -q
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: docker compose exec -T app npm run db:seed
      - name: 상태 확인
        run: |
          curl -fsS http://127.0.0.1:3200/healthz
          curl -fsS http://127.0.0.1:3200/readyz
          curl -fsS http://127.0.0.1:3200/ | grep -q "스터디온에듀"
          curl -fsS "http://127.0.0.1:3200/courses?category=DEV" | grep -q "SO-DEV-"
          curl -fsS http://127.0.0.1:3200/status | grep -q "정상이에요"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3200/metrics)" = "401"
          curl -fsS http://127.0.0.1:3200/api/v1/openapi.json | grep -q "스터디온에듀 외부 시스템 API"
      - name: 지표 키 발급 → /metrics 200
        run: |
          KEY=$(docker compose exec -T app npm run -s apikey -- --name ci-prometheus --scopes metrics | tail -1)
          curl -fsS -H "Authorization: Bearer $KEY" http://127.0.0.1:3200/metrics | grep -q "studyon_db_connections"
      - name: 다시 켜도 데이터가 남는다
        run: |
          docker compose restart app
          docker compose up -d --wait --wait-timeout 120
          curl -fsS "http://127.0.0.1:3200/courses?category=DEV" | grep -q "SO-DEV-"
      - if: failure()
        run: docker compose logs --tail 200
